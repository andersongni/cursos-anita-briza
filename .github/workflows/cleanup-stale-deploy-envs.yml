# One-shot: remove ambientes de deploy legados (nomes antigos do projeto Vercel).
# Pode ser apagado depois que rodar com sucesso.
name: Cleanup stale deploy envs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale-deploy-envs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write
  # necessário para DELETE /environments/{name}
  administration: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale GitHub deployment environments
        uses: actions/github-script@v7
        with:
          script: |
            // Vercel usava "Production – {nome-antigo}" com EN DASH (U+2013), não hífen.
            const enDash = '\u2013'
            const staleExact = new Set([
              `Production ${enDash} introducao-a-informatica`,
              `Production ${enDash} avaliacao-anita-briza`,
            ])
            const isStale = (name) => {
              if (!name) return false
              if (staleExact.has(name)) return true
              // fallback: qualquer ambiente Production com nome antigo do projeto
              const normalized = name.replace(/\u2013|\u2014/g, '-').toLowerCase()
              return (
                normalized.includes('introducao-a-informatica') ||
                normalized.includes('avaliacao-anita-briza')
              )
            }

            let page = 1
            let removedDeployments = 0
            const seenEnvs = new Set()

            while (page <= 20) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              })
              if (!deployments.length) break

              for (const deployment of deployments) {
                seenEnvs.add(deployment.environment)
                if (!isStale(deployment.environment)) continue

                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: deployment.id,
                    state: 'inactive',
                  })
                } catch (error) {
                  console.log(`status skip ${deployment.id}: ${error.message}`)
                }

                await github.rest.repos.deleteDeployment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                })
                removedDeployments++
                console.log(`Deleted deployment ${deployment.id} (${deployment.environment})`)
              }

              if (deployments.length < 100) break
              page++
            }

            console.log('Environments seen:', [...seenEnvs].join(' | '))

            for (const name of [...seenEnvs].filter(isStale)) {
              try {
                await github.rest.repos.deleteAnEnvironment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: name,
                })
                console.log(`Deleted environment: ${name}`)
              } catch (error) {
                const status = error?.status || error?.response?.status
                console.log(`Environment "${name}" not deleted (status ${status}): ${error.message}`)
              }
            }

            if (removedDeployments === 0) {
              core.setFailed('No stale deployments were removed — check environment name matching.')
            } else {
              console.log(`Done. Removed ${removedDeployments} stale deployment(s).`)
            }
