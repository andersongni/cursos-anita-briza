# Qualidade (lint/types/build). Segurança fica em codeql.yml — ambos devem
# estar como required checks na branch main (Settings → Rules / Branches).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Build pode tocar páginas admin que leem o banco — precisa do schema local.
      - name: Prepare SQLite schema
        run: npx prisma db push
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/dev.db
          JWT_SECRET: ci-build-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
